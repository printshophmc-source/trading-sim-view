const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function unlock(pw){
  const key = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b64(SALT), iterations:300000, hash:"SHA-256"},
    await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]),
    {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(IV)}, key, b64(DATA));
  return new TextDecoder().decode(plain);
}
async function tryOpen(pw, remember){
  try{
    const html = await unlock(pw);
    if(remember){ try{ localStorage.setItem("simpw", pw); }catch(e){} }
    document.open(); document.write(html); document.close();
    return true;
  }catch(e){ return false; }
}
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const ok = await tryOpen(document.getElementById("pw").value, true);
  if(!ok) document.getElementById("err").textContent = "あいことばが ちがいます";
});
// 一度合っていれば次からは自動で開く
try{
  const saved = localStorage.getItem("simpw");
  if(saved) tryOpen(saved, false);
}catch(e){}
