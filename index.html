<style>
:root{
  /* スーファミ後期のRPGメニュー風パレット */
  --bg:#080B18;
  --win-top:#3A5FD0; --win-mid:#1D2F8C; --win-bot:#0E1848;
  --edge-dark:#050818; --edge-light:#8FB4F0;
  --text:#FFFFFF; --dim:#B9C8E8; --gold:#F7C948;
  --pos:#7BE884; --neg:#FF8072; --dead:#C0392B;
  --hp-hi:#4CD964; --hp-mid:#F7C948; --hp-lo:#FF4B3E;
  --pixel:'Press Start 2P','DotGothic16',monospace;
  --num:'VT323','DotGothic16',monospace;
  --jp:'DotGothic16','Press Start 2P',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{
  font-family:var(--jp);color:var(--text);
  background:
    repeating-linear-gradient(180deg, rgba(255,255,255,.028) 0 1px, transparent 1px 3px),
    radial-gradient(120% 90% at 50% 0%, #1A2350 0%, var(--bg) 70%);
  display:flex;justify-content:center;min-height:100vh;
  -webkit-font-smoothing:none;
}
.device{width:100%;max-width:480px;padding:8px;min-height:100vh;display:flex;flex-direction:column;gap:8px}
.win{
  background:linear-gradient(180deg,var(--win-top) 0%,var(--win-mid) 45%,var(--win-bot) 100%);
  border:2px solid var(--edge-dark);
  box-shadow:inset 0 0 0 2px var(--edge-light);
  padding:10px 12px;
}
h1,h2,h3,.pix{font-family:var(--pixel);font-weight:normal;text-shadow:1px 1px 0 var(--edge-dark)}
header{display:flex;justify-content:space-between;align-items:center;gap:8px}
header .t{font-family:var(--pixel);font-size:11px;color:var(--gold);text-shadow:1px 1px 0 var(--edge-dark)}
header .date{font-family:var(--num);font-size:19px;color:var(--dim)}
main{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
nav{display:flex;gap:6px}
nav button{
  flex:1;cursor:pointer;color:var(--dim);
  background:linear-gradient(180deg,var(--win-top) 0%,var(--win-mid) 45%,var(--win-bot) 100%);
  border:2px solid var(--edge-dark);box-shadow:inset 0 0 0 2px var(--edge-light);
  padding:11px 2px;font-family:var(--jp);font-size:16px;text-shadow:1px 1px 0 var(--edge-dark);
}
nav button[aria-current="true"]{color:var(--gold)}
nav button[aria-current="true"]::before{content:"▶ "}

/* --- 警告 --- */
.alert{border-color:#6B1F1F;box-shadow:inset 0 0 0 2px #E27070;
  background:linear-gradient(180deg,#8E2B2B 0%,#5C1616 60%,#3A0D0D 100%);font-size:16px;line-height:1.6}
.alert .pix{font-size:10px;color:#FFD9D9;display:block;margin-bottom:6px}

/* --- パーティ --- */

  display:grid;grid-template-columns:68px 1fr;gap:12px;align-items:start;
  width:100%;text-align:left;cursor:pointer;color:var(--text);font-family:var(--jp);
}
.sprite{width:64px;height:64px;image-rendering:pixelated;display:block;
  filter:drop-shadow(2px 2px 0 rgba(0,0,0,.55))}
.mini{width:22px;height:22px;image-rendering:pixelated;display:inline-block;vertical-align:middle}
.buddy{display:flex;align-items:center;gap:5px;margin-top:5px;font-size:14px;color:var(--dim)}
.buddy b{color:var(--gold);font-weight:normal}

/* --- 銘柄図鑑 --- */

.bookcell{padding:7px 4px;text-align:center}
.bookcell.idle{opacity:.5}
.bsprite{width:52px;height:52px;image-rendering:pixelated;display:block;margin:0 auto 3px;
  filter:drop-shadow(2px 2px 0 rgba(0,0,0,.5))}
.bsym{font-family:var(--pixel);font-size:9px;color:var(--gold);text-shadow:1px 1px 0 var(--edge-dark)}
.bsec{font-size:12px;color:var(--dim);margin-top:3px}
.bnum{font-family:var(--num);font-size:19px;margin-top:3px}
.bsub{font-size:12px;color:var(--dim);line-height:1.4}

.hpfill{height:100%;transition:none}
.hpnum{font-family:var(--num);font-size:18px;min-width:46px;text-align:right;color:var(--dim)}
.money{font-family:var(--num);font-size:25px;color:var(--gold);letter-spacing:.5px;

.tag.good{background:#1E6B33;border-color:#7BE884;color:#DFFFE6}

h3.sec{font-size:10px;color:var(--gold);margin-bottom:9px;letter-spacing:.5px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:16px;

.num{font-family:var(--num);font-size:18px}

.spark{width:100%;height:76px;display:block;margin-top:8px}
.note{font-size:14px;line-height:1.65;color:var(--dim);margin-top:7px}

#gloss{position:fixed;inset:0;background:rgba(4,7,20,.7);z-index:50;

#gloss[hidden]{display:none}
#glossbox{max-width:360px;width:100%}
.speech{display:block;font-size:14px;color:var(--dim);margin-top:4px}

<script>
/* =====================================================================
   キャラのドット絵（48×48・ちびキャラ・かわいい路線）

   お手本にした要素:
     - 頭が体の2倍くらい大きい
     - まん丸の黒い目 + 白い光 + ピンクのほっぺ
     - やわらかいパステルの色
     - 人間だけでなく動物もいる

   作り方は「ハイブリッド」:
     - 種族(人間/ねこ/いぬ/くま/うさぎ/ひつじ)・髪型・小物は手で設計
     - どの種族になるか、色、髪型はキャラ名から自動で決まる
   同じ名前なら必ず同じ絵になる。実在企業のロゴ・商標は使わない。
   ===================================================================== */

const N = 48;
const CX = 23, CY = 19;          // 頭の中心
const HEAD_RX = 13, HEAD_RY = 12;

/* ---------- 乱数（名前から決まる） ---------- */
function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function rng32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const hsl = (h, s, l) =>
  `hsl(${Math.round((h % 360 + 360) % 360)} ${Math.round(Math.max(0, Math.min(100, s)))}% ${Math.round(Math.max(0, Math.min(100, l)))}%)`;

/* ---------- 色（パステル4段階） ---------- */
function ramp(hue, sat, lit, dead) {
  const s = dead ? 5 : sat;
  const h = dead ? 220 : hue;
  return [
    hsl(h, s, lit - 11),   // 影
    hsl(h, s, lit),        // 基本
    hsl(h, s * 0.9, lit + 8),
    hsl(h, s * 0.8, lit + 14),
  ];
}
const outlineOf = (hue, sat, dead) => hsl(dead ? 220 : hue, dead ? 10 : sat * 0.6, dead ? 30 : 34);

/* ---------- 図形 ---------- */
const blank = () => Array.from({ length: N }, () => new Array(N).fill(false));
function ellipse(part, cx, cy, rx, ry) {
  for (let y = Math.floor(cy - ry); y <= cy + ry; y++)
    for (let x = Math.floor(cx - rx); x <= cx + rx; x++)
      if (y >= 0 && y < N && x >= 0 && x < N &&
          ((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2 <= 1) part[y][x] = true;
}
const disc = (part, cx, cy, r) => ellipse(part, cx, cy, r, r);
function box(part, x0, y0, x1, y1) {
  for (let y = Math.max(0, y0); y <= Math.min(N - 1, y1); y++)
    for (let x = Math.max(0, x0); x <= Math.min(N - 1, x1); x++) part[y][x] = true;
}
function tri(part, cx, topY, half, h) {
  for (let t = 0; t < h; t++) {
    const w = Math.round(half * (t / (h - 1)));
    box(part, cx - w, topY + t, cx + w, topY + t);
  }
}

/* ---------- やわらかい陰影 ----------
   かわいさ優先で、ほぼ平塗り。ふちの内側に1段の影/光を入れるだけ。 */
function depthField(mask) {
  const d = Array.from({ length: N }, () => new Array(N).fill(0));
  const inside = (y, x) => y >= 0 && y < N && x >= 0 && x < N && mask[y][x];
  const q = [];
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    if (!mask[y][x]) continue;
    if (!(inside(y - 1, x) && inside(y + 1, x) && inside(y, x - 1) && inside(y, x + 1))) {
      d[y][x] = 1; q.push([y, x]);
    }
  }
  for (let i = 0; i < q.length; i++) {
    const [y, x] = q[i];
    for (const [ny, nx] of [[y - 1, x], [y + 1, x], [y, x - 1], [y, x + 1]])
      if (inside(ny, nx) && d[ny][nx] === 0) { d[ny][nx] = d[y][x] + 1; q.push([ny, nx]); }
  }
  return d;
}
function paint(px, mask, tones, line) {
  const d = depthField(mask);
  const at = (y, x) => (d[y] && d[y][x] !== undefined) ? d[y][x] : 0;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    if (!mask[y][x]) continue;
    if (d[y][x] <= 1) { px[y][x] = line; continue; }
    if (d[y][x] === 2) {
      const litSide = at(y - 1, x - 1) <= 1 || at(y - 1, x) <= 1;   // 上側は光
      const darkSide = at(y + 1, x) <= 1 || at(y + 1, x + 1) <= 1;  // 下側は影
      px[y][x] = litSide && !darkSide ? tones[3] : (darkSide && !litSide ? tones[0] : tones[1]);
      continue;
    }
    px[y][x] = tones[1];
  }
}

/* ---------- 小物（14×14。a 主色 / b 濃 / c 明 / d さし色 / k ふち） ---------- */
const PROPS = {
  chip: ['..............','...b.b.b.b....','..kkkkkkkkkk..','.bkaaaaaaaakb.','..kaccccccak..','.bkaccccccakb.','..kaccccccak..','.bkaaaaaaaakb.','..kkkkkkkkkk..','...b.b.b.b....','..............','..............'],
  laptop: ['..............','..kkkkkkkkkk..','..kcccccccck..','..kcaaaaaack..','..kcaaaaaack..','..kcccccccck..','..kkkkkkkkkk..','.kbbbbbbbbbbk.','.kbdddddddbbk.','.kkkkkkkkkkkk.','..............','..............'],
  phone: ['....kkkkkk....','....kaaaaak...','....kacccak...','....kacccak...','....kacccak...','....kacccak...','....kacccak...','....kacccak...','....kaaaaak...','....kkkkkk....','..............','..............'],
  globe: ['.....kkkk.....','...kkcccckk...','..kcacccacak..','.kcaacccaaack.','.kaaaaaaaaaak.','.kcaacccaaack.','..kcacccacak..','...kkcccckk...','.....kkkk.....','..............','..............','..............'],
  box: ['..............','..kkkkkkkkkk..','..kaaaddaaak..','..kaaaddaaak..','..kkkkkkkkkk..','..kbbbddbbbk..','..kbbbddbbbk..','..kbbbddbbbk..','..kbbbddbbbk..','..kkkkkkkkkk..','..............','..............'],
  screen: ['..kkkkkkkkkk..','..kbbbbbbbbk..','..kbccc...bk..','..kbcccc..bk..','..kbccccc.bk..','..kbcccc..bk..','..kbccc...bk..','..kbbbbbbbbk..','..kkkkkkkkkk..','.....kaak.....','....kaaaak....','..............'],
  car: ['..............','....kkkkkk....','...kcccccck...','..kkkkkkkkkk..','.kaaaaaaaaaak.','.kaaaaaaaaaak.','.kaaaaaaaaaak.','.kkbkkkkkkbkk.','...kbk....kbk.','...kkk....kkk.','..............','..............'],
  coin: ['.....kkkk.....','...kkcccckk...','..kcaaaaaack..','.kcaadaadaack.','.kaaadaadaaak.','.kaaadaadaaak.','.kcaadaadaack.','..kcaaaaaack..','...kkcccckk...','.....kkkk.....','..............','..............'],
  card: ['..............','..kkkkkkkkkk..','..kaaaaaaaak..','..kbbbbbbbbk..','..kaaaaaaaak..','..kacck...ak..','..kacck...ak..','..kaaaaaaaak..','..kkkkkkkkkk..','..............','..............','..............'],
  chart: ['..............','.k...........k','.k.........dd.','.k.......dd..d','.k.....dd.....','.k...dd.......','.k.ccc..aaa...','.k.ccc.baaab..','.kkccckbaaabkk','..............','..............','..............'],
  drum: ['...kkkkkkkk...','..kaaaaaaaak..','..kbbbbbbbbk..','..kaaaaaaaak..','..kaddddddak..','..kaaaaaaaak..','..kbbbbbbbbk..','..kaaaaaaaak..','...kkkkkkkk...','..............','..............','..............'],
  wrench: ['..........kkk.','.........kaak.','.......kkkaak.','......kaaakk..','....kkaaak....','...kaaakk.....','..kaaak.......','.kaaak........','.kaak.........','.kkk..........','..............','..............'],
  pill: ['..........kk..','........kkaak.','......kkaaaak.','....kkaaaaakk.','..kkcccaaakk..','.kcccccakk....','.kcccckk......','.kcckk........','.kkk..........','..............','..............','..............'],
  cross: ['.....kkkk.....','.....kaak.....','.....kaak.....','.kkkkkaakkkkk.','.kaaaaaaaaaak.','.kaaaaaaaaaak.','.kkkkkaakkkkk.','.....kaak.....','.....kaak.....','.....kkkk.....','..............','..............'],
  basket: ['...k......k...','...kk....kk...','....k....k....','..kkkkkkkkkk..','..kaaaaaaaak..','..kabaabaabk..','..kabaabaabk..','..kabaabaabk..','...kaaaaaak...','....kkkkkk....','..............','..............'],
  hammer: ['...kkkkkkk....','..kaaaaaaak...','..kaccccaak...','..kaaaaaaak...','...kkkbkkk....','.....kbk......','.....kbk......','.....kbk......','.....kbk......','.....kkk......','..............','..............'],
  shoe: ['..............','...kk.........','..kaak........','..kaaakk......','..kaccaakkkk..','..kacccaaaaak.','..kaaaaaaaaak.','.kbbbbbbbbbbk.','.kkkkkkkkkkkk.','..............','..............','..............'],
  cup: ['.....d..d.....','....d..d......','.....d..d.....','..kkkkkkkkk...','..kccccccck...','..kabbbbbakkk.','..kabbbbbak.k.','..kaaaaaaakkk.','...kaaaaaak...','....kkkkkk....','..............','..............'],
  burger: ['...kkkkkkkk...','..kaaaaaaaak..','.kacccccccak..','.kkkkkkkkkkk..','.kdddddddddk..','.kbbbbbbbbbk..','.kdddddddddk..','.kaaaaaaaaak..','..kkkkkkkkk...','..............','..............','..............'],
  star: ['......kk......','.....kaak.....','.....kaak.....','kkkkkaaakkkkk.','kaaaaaaaaaaak.','.kaaaaaaaaak..','..kaaaaaaak...','..kaakkkaak...','.kaak...kaak..','.kk.......kk..','..............','..............'],
  plane: ['..........kk..','.........kaak.','..kkkkkkkaak..','.kaaaaaaaaaak.','.kcccccccaaak.','.kkkkkkkkaaak.','.......kkaak..','......kaaak...','.....kaak.....','.....kkk......','..............','..............'],
  helmet: ['.....kkkk.....','...kkaaaakk...','..kaaaaaaaak..','..kaccccccak..','.kaaaaaaaaaak.','kaaaaaaaaaaaak','kkkkkkkkkkkkkk','..............','..............','..............','..............','..............'],
  wifi: ['...kkkkkkkk...','..kaaaaaaaak..','.ka........ak.','ka..kkkkkk..ak','....kaaaaak...','....ka....ak..','.......kk.....','......kaak....','......kaak....','.......kk.....','..............','..............'],
  crown: ['..k........k..','..k...kk...k..','..kk.kaak.kk..','..kakaaaakak..','..kaaaaaaaak..','..kaaaaaaaak..','..kadaadaadk..','..kaaaaaaaak..','..kkkkkkkkkk..','..............','..............','..............'],
  arrow: ['......kk......','.....kaak.....','....kaaaak....','...kaaaaaak...','..kaaaaaaaak..','.kkkkaaakkkk..','....kaaak.....','....kaaak.....','....kaaak.....','....kkkk......','..............','..............'],
  scale: ['......kk......','.kkkkkaakkkkk.','.k....kk....k.','kak...kk...kak','kaak..kk..kaak','.kk...kk...kk.','......kk......','....kkaakk....','...kaaaaaak...','...kkkkkkkk...','..............','..............'],
  bolt: ['.......kk.....','......kaak....','.....kaaak....','....kaaak.....','...kaaaakkkk..','...kaaaaaaak..','....kkkaaak...','......kaak....','.....kaak.....','.....kkk......','..............','..............'],
  sun: ['..k...kk...k..','...k..kk..k...','.....kaak.....','...kkaaaakk...','.kkkaaaaaakkk.','...kaaaaaak...','.....kaak.....','...k..kk..k...','..k...kk...k..','..............','..............','..............'],
};

/* ---------- 種族(10種) ---------- */
const SPECIES = ['human', 'human', 'human', 'cat', 'dog', 'bear', 'rabbit', 'sheep', 'panda', 'penguin', 'fox', 'frog'];
const HAIRSTYLES = ['short', 'bob', 'twin', 'pony', 'spiky', 'long'];

/* 種族ごとの「らしい」毛色(見分けがつくように種族で色域を固定する) */
const FUR_CHOICES = {
  cat:     [[38, 45, 80], [25, 60, 72], [220, 10, 76]],
  dog:     [[32, 45, 70], [45, 40, 80], [20, 35, 62]],
  bear:    [[30, 45, 62], [38, 50, 74]],
  rabbit:  [[40, 15, 90], [345, 40, 84]],
  sheep:   [[40, 22, 88]],
  panda:   [[40, 8, 92]],
  penguin: [[225, 28, 40]],
  fox:     [[24, 62, 64], [16, 55, 58]],
  frog:    [[100, 40, 70], [140, 35, 66]],
};
/* 人間の髪は定番色(黒/茶/金/ピンク/青/緑/紫) */
const HAIR_COLORS = [[240, 12, 30], [25, 45, 42], [45, 60, 68], [340, 55, 70], [210, 45, 60], [130, 30, 55], [270, 40, 62]];

/**
 * ちびキャラのドット絵を作る。
 * @param {string} name  キャラ名 or 銘柄コード（同じなら必ず同じ絵）
 * @param {object} opt   {prop:'chip', dead:false}
 */
function makeChibi(name, opt = {}) {
  const { prop = null, dead = false } = opt;
  const seed = hashStr(name);
  const r = rng32(seed);
  const species = SPECIES[seed % SPECIES.length];
  const outfitHue = ((seed >>> 16) + 150) % 360;
  const furPick = FUR_CHOICES[species] || [[(seed >>> 6) % 360, 34, 76]];
  const [furHue, furSat, furLit] = furPick[(seed >>> 9) % furPick.length];
  const [hairHue, hairSat, hairLit] = HAIR_COLORS[(seed >>> 11) % HAIR_COLORS.length];

  const px = Array.from({ length: N }, () => new Array(N).fill(null));

  // 色: 肌はクリーム色、動物の毛はパステル、服もパステル
  const skinT = ramp(28, dead ? 5 : 42, 84, dead);
  const skinL = outlineOf(24, 40, dead);
  const furT = ramp(furHue, dead ? 5 : furSat, furLit, dead);
  const furL = outlineOf(furHue, furSat, dead);
  const outfitT = ramp(outfitHue, dead ? 5 : 44, 68, dead);
  const outfitL = outlineOf(outfitHue, 46, dead);
  const hairT = ramp(hairHue, dead ? 5 : hairSat, hairLit, dead);
  const hairL = outlineOf(hairHue, hairSat, dead);
  const darkT = ramp(240, dead ? 5 : 10, 26, dead);   // パンダの耳・もよう用
  const darkL = outlineOf(240, 12, dead);

  const isAnimal = species !== 'human';
  const headT = isAnimal ? furT : skinT;
  const headL = isAnimal ? furL : skinL;

  /* --- 耳（頭より先に塗る = 頭のうしろ） --- */
  const ears = blank(), earIn = blank();
  if (species === 'cat') {
    tri(ears, CX - 8, 3, 4, 7); tri(ears, CX + 8, 3, 4, 7);
    tri(earIn, CX - 8, 5, 2, 4); tri(earIn, CX + 8, 5, 2, 4);
  } else if (species === 'dog') {
    ellipse(ears, CX - 14, 14, 3, 8); ellipse(ears, CX + 14, 14, 3, 8);
  } else if (species === 'bear') {
    disc(ears, CX - 9, 6, 4); disc(ears, CX + 9, 6, 4);
    disc(earIn, CX - 9, 6, 2); disc(earIn, CX + 9, 6, 2);
  } else if (species === 'rabbit') {
    ellipse(ears, CX - 6, 3, 3, 8); ellipse(ears, CX + 6, 3, 3, 8);
    ellipse(earIn, CX - 6, 4, 1, 5); ellipse(earIn, CX + 6, 4, 1, 5);
  } else if (species === 'sheep') {
    // 羊は毛のもこもこを頭のまわりに
    for (let k = 0; k < 7; k++) {
      const a = Math.PI * (1.05 + 0.15 * k);
      disc(ears, Math.round(CX + Math.cos(a) * 12), Math.round(CY + Math.sin(a) * 11 - 1), 4);
    }
  } else if (species === 'panda') {
    disc(ears, CX - 9, 6, 4); disc(ears, CX + 9, 6, 4);
  } else if (species === 'fox') {
    tri(ears, CX - 8, 1, 5, 9); tri(ears, CX + 8, 1, 5, 9);
    tri(earIn, CX - 8, 4, 2, 5); tri(earIn, CX + 8, 4, 2, 5);
  } else if (species === 'frog') {
    // カエルは頭の上の目玉(あとで目を描き込む)
    disc(ears, CX - 7, 6, 4); disc(ears, CX + 7, 6, 4);
  }
  const earT = species === 'panda' ? darkT : furT;
  const earL = species === 'panda' ? darkL : furL;
  if (ears.some(row => row.some(Boolean))) paint(px, ears, earT, earL);
  if (earIn.some(row => row.some(Boolean))) {
    const inT = ramp(350, dead ? 5 : 45, 82, dead);
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (earIn[y][x]) px[y][x] = inT[1];
  }

  /* --- 体（頭のうしろに少し見える） --- */
  const bodyM = blank(), feetM = blank();
  ellipse(bodyM, CX, 38, 9, 8);
  box(bodyM, CX - 9, 38, CX + 9, 43);
  box(feetM, CX - 7, 44, CX - 2, 46); box(feetM, CX + 2, 44, CX + 7, 46);
  // 手は描かない(この大きさだと記号に見えてしまう。お手本もほぼ省略している)
  paint(px, bodyM, outfitT, outfitL);
  paint(px, feetM, isAnimal ? furT : ramp(outfitHue, 30, 40, dead), isAnimal ? furL : outlineOf(outfitHue, 32, dead));

  /* --- 頭（大きく・最後に上書き = 一番手前） --- */
  const headM = blank();
  ellipse(headM, CX, CY, HEAD_RX, HEAD_RY);
  paint(px, headM, headT, headL);

  /* --- 動物の口まわり（マズル） --- */
  if (['cat', 'dog', 'bear', 'rabbit', 'fox'].includes(species)) {
    const muz = blank();
    ellipse(muz, CX, CY + 6, 5, 4);
    const muzT = ramp(furHue, dead ? 5 : 20, 90, dead);
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (muz[y][x]) px[y][x] = muzT[1];
  }
  if (species === 'sheep') {
    // 顔はミルクティー色
    const face = blank();
    ellipse(face, CX, CY + 2, 9, 8);
    const faceT = ramp(28, dead ? 5 : 30, 78, dead);
    paint(px, face, faceT, outlineOf(26, 32, dead));
  }

  /* --- 人間の髪 --- */
  if (!isAnimal) {
    const hair = blank();
    const style = HAIRSTYLES[(seed >>> 3) % HAIRSTYLES.length];
    ellipse(hair, CX, CY - 1, HEAD_RX + 1, HEAD_RY + 1);
    // 顔を出す: 額から下をくり抜き、前髪をぎざぎざに残す
    for (let y = CY - 4; y < N; y++) for (let x = 0; x < N; x++) hair[y][x] = false;
    for (let x = CX - 11; x <= CX + 11; x++) {
      const deep = ((x - CX + 22) % 4 < 2) ? 2 : 0;   // ぎざぎざ前髪
      for (let y = CY - 4; y < CY - 2 + deep; y++)
        if (headM[y] && headM[y][x]) hair[y][x] = true;
    }
    // 横の毛(もみあげ)
    for (const sx of [-1, 1]) {
      box(hair, CX + sx * 12 - 1, CY - 4, CX + sx * 12 + 1, CY + 4);
    }
    if (style === 'bob') { box(hair, CX - 13, CY - 2, CX - 11, CY + 8); box(hair, CX + 11, CY - 2, CX + 13, CY + 8); }
    if (style === 'long') { box(hair, CX - 13, CY - 2, CX - 11, 36); box(hair, CX + 11, CY - 2, CX + 13, 36); }
    if (style === 'twin') { disc(hair, CX - 14, CY + 8, 4); disc(hair, CX + 14, CY + 8, 4); }
    if (style === 'pony') { disc(hair, CX + 13, CY - 8, 4); ellipse(hair, CX + 15, CY, 2, 8); }
    if (style === 'spiky') {
      for (let k = 0; k < 4; k++) tri(hair, CX - 7 + k * 5, 2, 3, 6);
    }
    paint(px, hair, hairT, hairL);
  }

  /* --- 種族の顔の特徴(目より先に描く下地) --- */
  if (species === 'panda') {
    // 目のまわりの黒いもよう
    const patch = blank();
    ellipse(patch, CX - 5, CY + 2, 3, 4); ellipse(patch, CX + 5, CY + 2, 3, 4);
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++)
      if (patch[y][x] && px[y][x]) px[y][x] = darkT[1];
  }
  if (species === 'penguin') {
    // 白いお顔
    const face = blank();
    ellipse(face, CX, CY + 3, 8, 7);
    const w = dead ? '#BBBBBB' : hsl(40, 15, 93);
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++)
      if (face[y][x] && px[y][x] && px[y][x] !== headL) px[y][x] = w;
  }

  /* --- 目(名前で表情が変わる: ふつう/にっこり/きらきら/ねむそう) --- */
  const eyeY = CY + 1;
  const eye = dead ? '#000000' : '#2B2420';
  const expr = dead ? 'round' : ['round', 'round', 'happy', 'sparkle', 'sleepy'][(seed >>> 13) % 5];

  const drawEye = (ex) => {
    if (expr === 'happy') {                     // にっこり(∪の形)
      for (const [dy, dx] of [[0, 0], [1, 1], [1, 2], [0, 3]])
        if (px[eyeY + dy] && px[eyeY + dy][ex + dx - 1]) px[eyeY + dy][ex + dx - 1] = eye;
      return;
    }
    if (expr === 'sleepy') {                    // ねむそう(横線)
      for (let dx = 0; dx < 3; dx++)
        if (px[eyeY + 1] && px[eyeY + 1][ex + dx]) px[eyeY + 1][ex + dx] = eye;
      return;
    }
    for (let dy = 0; dy < 3; dy++) for (let dx = 0; dx < 3; dx++) {
      const yy = eyeY + dy, xx = ex + dx;
      if (px[yy] && px[yy][xx]) px[yy][xx] = eye;
    }
    if (px[eyeY] && px[eyeY][ex]) px[eyeY][ex] = dead ? '#444' : '#FFFFFF';   // 目の光
    if (expr === 'sparkle' && px[eyeY + 2] && px[eyeY + 2][ex + 2]) px[eyeY + 2][ex + 2] = '#FFFFFF';
  };

  if (species === 'frog') {
    // カエルは頭の上の目玉に目を描く
    for (const bx of [CX - 7, CX + 7]) {
      for (let dy = 0; dy < 2; dy++) for (let dx = 0; dx < 2; dx++)
        if (px[5 + dy] && px[5 + dy][bx - 1 + dx]) px[5 + dy][bx - 1 + dx] = '#FFFFFF';
      if (px[6] && px[6][bx]) px[6][bx] = eye;
    }
  } else {
    drawEye(CX - 6); drawEye(CX + 4);
  }

  /* --- ほっぺ --- */
  if (!dead) {
    const blush = hsl(354, 75, 82);
    for (const bx of [CX - 10, CX + 8])
      for (let dx = 0; dx < 2; dx++)
        if (px[eyeY + 4] && px[eyeY + 4][bx + dx]) px[eyeY + 4][bx + dx] = blush;
  }

  /* --- 口・鼻(種族ごと) --- */
  const nose = dead ? '#333333' : hsl(350, 55, 62);
  if (species === 'penguin') {
    const beak = dead ? '#666666' : hsl(35, 85, 58);
    for (let dx = -1; dx <= 1; dx++) px[CY + 4][CX + dx] = beak;
    px[CY + 5][CX] = beak;
  } else if (species === 'frog') {
    for (let dx = -3; dx <= 3; dx++)                 // にっこり大きな口
      if (px[CY + 5] && px[CY + 5][CX + dx]) px[CY + 5][CX + dx] = eye;
  } else if (species === 'cat' || species === 'fox') {
    px[CY + 4][CX] = nose; px[CY + 4][CX + 1] = nose;
    px[CY + 6][CX - 1] = eye; px[CY + 6][CX + 2] = eye;   // ωの口
    px[CY + 5][CX] = eye; px[CY + 5][CX + 1] = eye;
  } else if (isAnimal && species !== 'sheep') {
    px[CY + 5][CX] = nose; px[CY + 5][CX + 1] = nose;
    if (px[CY + 7]) px[CY + 7][CX] = eye;
  } else {
    const my = eyeY + 5;
    px[my][CX - 1] = eye; px[my][CX] = eye; px[my][CX + 1] = eye;
    if (!dead && (seed >>> 21) % 3 === 0) px[my + 1][CX] = hsl(354, 70, 72);   // あけた口
  }

  /* --- アクセサリー(名前で決まる個性) --- */
  let acc = dead ? 'none' : ['none', 'ribbon', 'glasses', 'flower', 'star', 'none'][(seed >>> 18) % 6];
  if (species === 'frog' && acc === 'glasses') acc = 'star';   // カエルは目が頭の上なのでメガネは似合わない
  if (acc === 'ribbon') {
    // 頭の右上にリボン
    const rh = (seed >>> 20) % 360;
    const rb = hsl(rh, 70, 66), rbD = hsl(rh, 70, 48);
    const ry = ['rabbit', 'cat', 'fox'].includes(species) ? 10 : 7;
    const rx = CX + 7;
    for (const [dy, dx] of [[-1, -3], [-1, -2], [0, -3], [0, -2], [1, -3],
                            [-1, 2], [-1, 3], [0, 2], [0, 3], [1, 3]]) {
      const yy = ry + dy, xx = rx + dx;
      if (yy >= 0 && yy < N && xx >= 0 && xx < N) px[yy][xx] = rb;
    }
    for (const [dy, dx] of [[-1, -1], [-1, 0], [0, -1], [0, 0]]) px[ry + dy][rx + dx] = rbD;
  } else if (acc === 'glasses') {
    // まるメガネ
    const g = dead ? '#555555' : '#4A4455';
    for (const ex of [CX - 6, CX + 4]) {
      for (let dy = -1; dy <= 3; dy++) for (let dx = -1; dx <= 3; dx++) {
        if (!(dy === -1 || dy === 3 || dx === -1 || dx === 3)) continue;
        if ((dy === -1 || dy === 3) && (dx === -1 || dx === 3)) continue;   // 角を落とす
        const yy = eyeY + dy, xx = ex + dx;
        if (px[yy] && px[yy][xx]) px[yy][xx] = g;
      }
    }
    if (px[eyeY + 1]) { px[eyeY + 1][CX - 1] = g; px[eyeY + 1][CX] = g; px[eyeY + 1][CX + 1] = g; }
  } else if (acc === 'flower') {
    // 頭の左上にお花
    const fy = 8, fx = CX - 9;
    const petal = '#FFF0F6', center = hsl(45, 90, 62);
    for (const [dy, dx] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) {
      const yy = fy + dy, xx = fx + dx;
      if (yy >= 0 && yy < N && xx >= 0 && xx < N) px[yy][xx] = petal;
    }
    px[fy][fx] = center;
  } else if (acc === 'star') {
    // 頭の右上に星のかざり
    const sy = 8, sx = CX + 9;
    const st = hsl(48, 95, 66);
    for (const [dy, dx] of [[-1, 0], [1, 0], [0, -1], [0, 1], [0, 0]]) {
      const yy = sy + dy, xx = sx + dx;
      if (yy >= 0 && yy < N && xx >= 0 && xx < N) px[yy][xx] = st;
    }
  }

  /* --- 小物（右下に添える） --- */
  const art = PROPS[prop];
  if (art) {
    const propHue = (hashStr(prop || '') >>> 3) % 360;
    const P = ramp(propHue, dead ? 5 : 62, 58, dead);
    const D = ramp((propHue + 65) % 360, dead ? 5 : 70, 62, dead);
    const map = { a: P[1], b: P[0], c: P[3], d: D[2], k: outlineOf(propHue, 55, dead) };
    const ox = 34, oy = 33;
    for (let y = 0; y < art.length; y++) for (let x = 0; x < art[y].length; x++) {
      const ch = art[y][x];
      if (ch === '.' || !map[ch]) continue;
      const yy = oy + y, xx = ox + x;
      if (yy >= 0 && yy < N && xx >= 0 && xx < N) px[yy][xx] = map[ch];
    }
  }

  /* --- SVGへ（同じ色の横並びをまとめて軽くする） --- */
  let out = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${N} ${N}" `
          + `shape-rendering="crispEdges" class="sprite">`;
  for (let y = 0; y < N; y++) {
    let x = 0;
    while (x < N) {
      const c = px[y][x];
      if (!c) { x++; continue; }
      let w = 1;
      while (x + w < N && px[y][x + w] === c) w++;
      out += `<rect x="${x}" y="${y}" width="${w}" height="1" fill="${c}"/>`;
      x += w;
    }
  }
  return out + '</svg>';
}

function makeSprite(name, dead = false, prop = null) {
  return makeChibi(name, { prop, dead });
}

</script>
<script>
let STATE = null, TAB = 'party', DETAIL = null;

const yen = n => '¥' + Math.round(n).toLocaleString('ja-JP');
const esc = s => String(s).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

/* ---------- 用語解説（点線のことばをタップすると出る） ---------- */
const GLOSS = {
  'HP': '体力ゲージ。損した分だけ減ります。一番調子が良かったときから2割減ると脱落（そのキャラはもう取引できません）。',
  'Lv': '取引した回数。100回未満は、成績が良くても悪くても「まぐれ」と区別がつかないので、判定不能あつかいです。',
  'SPY君': 'アメリカの大企業500社をまとめ買いして、あとは寝ているだけのキャラ。判断ゼロ。ほかのキャラはこの子に勝てないと「わざわざ売買した意味がない」ことになります。',
  'コスト': '売買1回ごとに引かれるお金。手数料や「注文した瞬間に値段が少し不利になる」ぶんなど。デイトレ最大の敵で、いまのキャラたちの負けの主な原因はこれです。',
  '利益÷コスト': '稼ぎがコストの何倍あるか。3倍未満だと、少し環境が悪くなるだけで赤字に転落します。',
  '勝率': '勝った取引の割合。高くても、1回の負けが大きければ赤字になるので、これ単独では信用しません。',
  '損益比': '勝ったときの平均利益 ÷ 負けたときの平均損失。1より大きければ「勝つときのほうが大きく勝てている」。',
  'ドローダウン': '一番調子が良かったときから、どれだけ資産が減ったか。',
  '局面': '相場の状態。上がり調子・下がり調子・横ばいの3つに分けています。1つの局面でしか勝てないキャラは、相場が変わると崩れます。',
  '昇格候補': 'Lv100以上・SPY君超え・利益÷コスト3倍以上、の3条件を全て満たしたキャラ。それでも「答え合わせ期間」の試験が残っています。',
  '脱落': 'HPゼロ。一番良かったときから2割の損。このキャラは復活せず、直して出すなら新キャラとして再登録です。',
  'VWAP': 'その日の「みんなの平均購入価格」。出来高で重みづけした平均値段のこと。',
  '作成期間': 'キャラを作って調整してよい期間。過去データの前半です。',
  '答え合わせ期間': '調整に使わず、最後まで封印しておく直近6ヶ月。ここで同じ成績が出て、はじめて本物と言えます。',
  '図鑑': '銘柄（会社の株）ごとの成績表。全キャラ合計でその銘柄からいくら取れたかが見えます。',
};
const term = (label, key) => `<span class="term" data-g="${key || label}">${label}</span>`;

function showGloss(key){
  const g = GLOSS[key];
  if(!g) return;
  document.getElementById('gtitle').textContent = key;
  document.getElementById('gbody').textContent = g;
  document.getElementById('gloss').hidden = false;
}
document.addEventListener('click', e => {
  const t = e.target.closest('.term,[data-g]');
  if (t && t.dataset.g && GLOSS[t.dataset.g]) {
    e.stopPropagation(); e.preventDefault();
    showGloss(t.dataset.g);
  }
}, true);

/* ドット絵は画像として埋め込む（点の数が多いので、1つのタグにまとめて軽くする） */
const SPRITE_CACHE = new Map();
function spriteImg(name, prop, dead, cls){
  const key = name + '|' + prop + '|' + (dead ? 1 : 0);
  if(!SPRITE_CACHE.has(key)){
    const svg = makeChibi(name, {prop, dead});
    SPRITE_CACHE.set(key, 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg))));
  }
  return `<img class="${cls}" src="${SPRITE_CACHE.get(key)}" alt="${esc(name)}">`;
}
function chg(p){
  const cls = p > 0 ? 'up' : p < 0 ? 'down' : '';
  const mark = p > 0 ? '▲' : p < 0 ? '▼' : '－';
  return `<span class="chg ${cls}">${mark}${Math.abs(p).toFixed(1)}%</span>`;
}
function hpBar(hp, dead){
  const col = dead ? 'var(--dead)' : hp > 55 ? 'var(--hp-hi)' : hp > 25 ? 'var(--hp-mid)' : 'var(--hp-lo)';
  return `<span class="hpline">
    <span class="hptrack${(hp <= 25 && !dead) ? ' blink' : ''}">
      <span class="hpfill" style="width:${Math.max(0, Math.min(100, hp))}%;background:${col}"></span>
    </span><span class="hpnum">${Math.round(hp)}%</span></span>`;
}

function banner(){
  if(!STATE.meta.is_synthetic) return '';
  return `<div class="win alert"><span class="pix">!! DUMMY DATA !!</span>
    これは<b>ダミー（にせもの）のデータ</b>での成績です。
    ここで勝っても、戦略が正しい証拠には一切なりません。</div>`;
}

function speech(p){
  if (p.is_benchmark) return 'ねてるだけで つよい';
  if (p.eliminated) return 'もう うごけない…';
  if (p.promoted) return 'ほんものかも しれない！';
  if (!p.judgeable) return 'まだ しゅぎょうちゅう';
  if (p.cost_warning) return 'てすうりょうが つらいよ…';
  if (p.vs_benchmark_pt > 0) return 'ちょうし いいよ！';
  return 'がんばってるよ！';
}

function summaryCard(){
  const chars = STATE.party.filter(x => !x.is_benchmark);
  const deadN = chars.filter(x => x.eliminated).length;
  const leader = STATE.party[0];
  const costN = chars.filter(x => x.cost_warning).length;
  const l1 = `キャラ${chars.length}体中 ${deadN}体が${term('脱落')}。`;
  const l2 = leader.is_benchmark
    ? `首位は${term('SPY君')}（寝てるだけの物差し役）。まだ誰も超えられていません。`
    : `首位は ${esc(leader.name)}！`;
  const l3 = costN > 0
    ? `負けの主な原因は「${term('コスト')}負け」。売買のたびに引かれるお金で、稼ぎが消えています。`
    : '';
  return `<div class="win"><h3 class="sec">いまの戦況</h3>
    <p class="note" style="font-size:15px;line-height:1.8">${l1}${l2}<br>${l3}</p>
    <p class="note">点線のことばは、タップすると説明が出ます。キャラをタップすると詳しい成績が見られます。</p></div>`;
}

function viewParty(){
  return banner() + summaryCard() + STATE.party.map((p, i) => `
    <button class="win card ${p.eliminated ? 'dead' : ''}" data-i="${i}">
      <span>${spriteImg(p.name, p.prop, p.eliminated, 'sprite')}</span>
      <span>
        <span class="row1">
          <span class="cname">${esc(p.name)}</span>
          <span class="lv">${p.is_benchmark ? 'Lv --' : 'Lv ' + p.level}</span>
        </span>
        ${p.is_benchmark ? '' : hpBar(p.hp, p.eliminated)}

        <span class="speech">「${speech(p)}」</span>

function sparkline(curve){
  if(!curve || curve.length < 2) return '';
  const v = curve.map(c => c[1]);
  const min = Math.min(...v), max = Math.max(...v), span = (max - min) || 1;
  const pts = v.map((y, i) => `${(i / (v.length - 1) * 100).toFixed(2)},${(62 - (y - min) / span * 56).toFixed(2)}`).join(' ');
  const first = v[0], last = v[v.length - 1];
  return `<svg class="spark" viewBox="0 0 100 66" preserveAspectRatio="none">
    <polyline points="0,${(62 - (first - min) / span * 56).toFixed(2)} 100,${(62 - (first - min) / span * 56).toFixed(2)}"
      fill="none" stroke="rgba(255,255,255,.25)" stroke-width="1" stroke-dasharray="2 2"/>
    <polyline points="${pts}" fill="none" stroke="${last >= first ? '#7BE884' : '#FF8072'}" stroke-width="2"/></svg>`;
}

  view.innerHTML = DETAIL !== null ? viewDetail()
    : ({party:viewParty, book:viewBook, rank:viewRank, info:viewInfo}[TAB])();
  view.scrollTop = 0;
  document.querySelectorAll('nav button').forEach(b =>
    b.setAttribute('aria-current', String(b.dataset.tab === TAB && DETAIL === null)));
  view.querySelectorAll('.card').forEach(c => c.onclick = () => { DETAIL = Number(c.dataset.i); render(); });
  const back = document.getElementById('back');
  if(back) back.onclick = () => { DETAIL = null; render(); };
}
